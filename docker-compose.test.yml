# =============================================================================
# WorkPulse — Isolated PostgreSQL 16 Test Database for Automated Testing
# Reference: SAD v2.1.0 Bab I & Lampiran A, Playbook-02 § 7.2
# ISOLATION REQUIREMENT: Runs on port 54332 with tmpfs for rapid, ephemeral test runs.
# =============================================================================

services:
  test-db:
    image: postgres:16-alpine
    container_name: workpulse-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password_secure
      POSTGRES_DB: workpulse_test
    ports:
      - "54332:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workpulse_test"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s
    tmpfs:
      - /var/lib/postgresql
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=128MB
        -c synchronous_commit=off
        -c fsync=off
        -c full_page_writes=off
