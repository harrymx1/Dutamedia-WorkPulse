services:
  postgres:
    image: postgres:16-alpine
    container_name: workpulse-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: workpulse_dev
      POSTGRES_USER: workpulse_app
      POSTGRES_PASSWORD: workpulse_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpulse_app -d workpulse_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: workpulse-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata_dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
  miniodata_dev:

