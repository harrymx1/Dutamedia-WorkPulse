name: WorkPulse Clean-Slate CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_secure
          POSTGRES_DB: workpulse_test
        ports:
          - 54332:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:test_password_secure@localhost:54332/workpulse_test
      JWT_SECRET: test-super-secret-key-at-least-32-chars-long!
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: Strict TypeScript Typecheck
        run: npm run typecheck

      - name: Execute Unit Test Suites (Vitest)
        run: npm run test

      - name: Build Applications (NestJS & Vue 3)
        run: npm run build
